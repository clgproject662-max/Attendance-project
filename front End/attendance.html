<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Attendance</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">
        <img src="img/logo.png" alt="Logo" class="logo">
        <h2 class="center" style="padding-left: 35%;">College Attendance System</h2>
    </header>
    <div class="container">

        <h3 class="center">Attendance</h3>

        <div class="center">

            <input type="date" id="attendanceDate" onchange="renderAttendance()">
            <div id="attendanceStats"></div>

        </div>

        <table>

            <thead>
                <tr>

                    <th>Serial</th>
                    <th>Register No</th>
                    <th>Name</th>
                    <th>Status</th>

                </tr>
            </thead>

            <tbody id="attendanceBody"></tbody>

        </table>

        <div class="center">


            <button onclick="submitAttendance()">Submit</button> <br>
            <br>
            <br>
            <button onclick="location.href='home.html'">Back</button>



        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
