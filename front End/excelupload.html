<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Excel Upload</title>

    <link rel="stylesheet" href="style.css">

    <!-- SheetJS for reading Excel files in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
     <header class="header">
        <img src="img/logo.png" alt="Logo" class="logo">
        <h2 class="center" style="padding-left: 35%;">College Attendance System</h2>
    </header>

    <div class="container center">

        <h2>Upload Students</h2>

        <form id="uploadForm">

            <label>Department</label>
            <select id="department" required>
                <option value="" disabled selected>Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Tamil">Tamil</option>
                <option value="English">English</option>
            </select>

            <label>Year</label>
            <select id="year" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
            </select>

            <label>Select Excel File</label>
            <input type="file" id="file" accept=".xlsx,.xls" required>

            <button type="submit">Upload</button>

        </form>

        <div id="result"></div>

        <br>
        <button class="red" onclick="location.href='admin.html'">Back</button>

    </div>

    <script>

        document.getElementById("uploadForm").addEventListener("submit", function (e) {

            e.preventDefault();

            const department = document.getElementById("department").value;
            const year       = document.getElementById("year").value;
            const fileInput  = document.getElementById("file");

            if (!department || !year) {
                document.getElementById("result").innerHTML =
                    "<span style='color:red'>Please select Department and Year.</span>";
                return;
            }

            if (!fileInput.files[0]) {
                document.getElementById("result").innerHTML =
                    "<span style='color:red'>Please select an Excel file.</span>";
                return;
            }

            const file   = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (evt) {

                try {
                    // Parse the Excel workbook
                    const data     = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: "array" });

                    // Read first sheet
                    const sheetName = workbook.SheetNames[0];
                    const sheet     = workbook.Sheets[sheetName];
                    const rows      = XLSX.utils.sheet_to_json(sheet, { defval: "" });

                    if (rows.length === 0) {
                        document.getElementById("result").innerHTML =
                            "<span style='color:red'>Excel file is empty or unreadable.</span>";
                        return;
                    }

                    // Load existing students from localStorage
                    let students = JSON.parse(localStorage.getItem("students")) || [];

                    // Remove old students for this department+year (admin replacing data)
                    students = students.filter(s =>
                        !(s.department === department && s.year === year)
                    );

                    let count   = 0;
                    let preview = "<table style='margin:10px auto;color:#fff;'><tr><th>No.</th><th>ID</th><th>Name</th></tr>";

                    rows.forEach((row, index) => {

                        // Get all column keys from this row
                        const keys = Object.keys(row);

                        // ID: match your exact column names first
                        const id = String(
                            row["reg number"]  || row["Reg Number"]  || row["REG NUMBER"]  ||
                            row["regno"]       || row["RegNo"]       || row["Reg No"]      ||
                            row["reg no"]      || row["register no"] || row["Register No"] ||
                            row["studentId"]   || row["StudentId"]   || row["student id"]  ||
                            row["id"]          || row["ID"]          ||
                            // positional fallback: use 2nd column if nothing matched
                            (keys[1] !== undefined ? row[keys[1]] : "") || ""
                        ).trim();

                        // Name: match your exact column names first
                        const name = String(
                            row["bname"]       || row["Bname"]       || row["BNAME"]       ||
                            row["name"]        || row["Name"]        || row["NAME"]        ||
                            row["studentName"] || row["StudentName"] || row["student name"]||
                            row["Student"]     || row["student"]     ||
                            // positional fallback: use 3rd column (or 2nd if only 2 cols)
                            (keys[2] !== undefined ? row[keys[2]] : keys[1] !== undefined ? row[keys[1]] : "") || ""
                        ).trim();

                        // Serial: use your 'serial number' column if present
                        const serialFromFile = row["serial number"] || row["Serial Number"] ||
                                               row["S.No"] || row["sno"] || row["Sno"] || "";

                        if (!id && !name) return; // skip fully empty rows

                        const serial = serialFromFile ? Number(serialFromFile) : (students.length + 1);

                        students.push({
                            serial:     serial,
                            id:         id   || ("STU" + (index + 1)),
                            name:       name || "Unknown",
                            department: department,
                            year:       year
                        });

                        count++;
                        preview += `<tr><td>${serial}</td><td>${id}</td><td>${name}</td></tr>`;
                    });

                    preview += "</table>";

                    // Save back to localStorage - now staff can see these students
                    localStorage.setItem("students", JSON.stringify(students));

                    document.getElementById("result").innerHTML =
                        `<span style="color:#86efac;font-weight:bold;">
                            Upload Successful - ${count} students saved for 
                            ${department}, Year ${year}
                         </span><br>` + preview;

                } catch (err) {
                    console.error(err);
                    document.getElementById("result").innerHTML =
                        "<span style='color:red'>Failed to read Excel file. Please check the format.</span>";
                }
            };

            reader.readAsArrayBuffer(file);
        });

    </script>

</body>

</html>
